version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: modliq-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: modliq-redis
    ports:
      - "6379:6379"

  ml-engine:
    build:
      context: ./ml-engine
      dockerfile: Dockerfile
    container_name: modliq-ml-engine
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ML_INTERNAL_API_KEY=${ML_INTERNAL_API_KEY:-test-key}
      - CLIENT_ORIGIN=http://localhost:3000
      - BACKEND_ORIGIN=http://localhost:3001
    depends_on:
      - mongodb
      - redis

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: modliq-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=mongodb://mongodb:27017/modliq
      - REDIS_URL=redis://redis:6379
      - ML_ENGINE_URL=http://ml-engine:8000
      - ML_INTERNAL_API_KEY=${ML_INTERNAL_API_KEY:-test-key}
    depends_on:
      - mongodb
      - redis
      - ml-engine

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: modliq-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      - backend

volumes:
  mongo-data:
