name: Modliq CI Funnel Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  ml-engine-test:
    name: ML Engine Tests & Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          cd ml-engine
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Python Compile Check
        run: |
          cd ml-engine
          python -m py_compile entrypoint/main.py main.py
      - name: Run Pytest
        run: |
          cd ml-engine
          python -m pytest src/tests/ || true

  backend-test:
    name: Backend Typecheck & Prisma Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        run: |
          cd backend
          npm ci
      - name: Validate Prisma Schema
        run: |
          cd backend
          npx prisma validate --schema=src/db/prisma/schema.prisma
          npx prisma generate --schema=src/db/prisma/schema.prisma
      - name: TypeScript Compile Check
        run: |
          cd backend
          npx tsc --noEmit

  frontend-test:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        run: |
          cd frontend
          npm ci
      - name: Next.js Production Build Test
        env:
          NEXT_PUBLIC_API_URL: "https://modliq-api.onrender.com"
        run: |
          cd frontend
          npx next build
