name: Modliq Platform CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-ml-engine-check:
    name: ML Engine Verification (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          cd ml-engine
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python source files
        run: |
          cd ml-engine
          python -m py_compile main.py routers/train.py routers/monitor.py services/shap_explainer.py services/roi_calculator.py services/optimizer.py services/storage.py services/drift_detector.py

  backend-check:
    name: Backend API Verification (Node.js 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies & Generate Prisma Client
        run: |
          cd backend
          npm ci || npm install
          npx prisma generate

      - name: TypeScript Compile Check
        run: |
          cd backend
          npx tsc --noEmit

  frontend-check:
    name: Frontend App Verification (Next.js 15)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Next.js Production Build
        run: |
          cd frontend
          npx next build
