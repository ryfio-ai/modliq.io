<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B70AB" />
      <stop offset="100%" stop-color="#1B2A4A" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <!-- Abstract M Mark with connected process nodes & upward optimization curve -->
  <g transform="translate(10, 15)">
    <!-- Base M Structure -->
    <path d="M 10,65 L 10,15 L 30,50 L 50,15 L 50,65" fill="none" stroke="url(#blueGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Upward Optimization Curve -->
    <path d="M 5,55 Q 30,65 65,10" fill="none" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round"/>
    <!-- Connected Process Nodes -->
    <circle cx="10" cy="15" r="5" fill="#2B70AB" />
    <circle cx="30" cy="50" r="5" fill="#2B70AB" />
    <circle cx="50" cy="15" r="5" fill="#2B70AB" />
    <circle cx="65" cy="10" r="6" fill="#10B981" />
  </g>

  <!-- Brand Typography -->
  <text x="95" y="58" font-family="Arial, sans-serif" font-weight="900" font-size="42" fill="#1B2A4A" letter-spacing="-1">Modliq</text>
  <text x="96" y="78" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#2B70AB" letter-spacing="1">MANUFACTURING INTELLIGENCE</text>
</svg>
