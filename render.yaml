services:
  # ── Python ML Engine Web Service (100% Free Plan) ───────────────────
  - type: web
    name: modliq-ml-engine
    env: python
    region: oregon
    plan: free
    rootDir: ml-engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO

  # ── Node.js Express Backend API Web Service (100% Free Plan) ────────
  - type: web
    name: modliq-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ML_ENGINE_URL
        fromService:
          type: web
          name: modliq-ml-engine
          property: host

  # ── Next.js Frontend Web Service (100% Free Plan) ───────────────────
  - type: web
    name: modliq-frontend
    env: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: modliq-backend
          property: host
